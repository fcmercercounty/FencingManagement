name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write   # for Azure sign-in with OpenID Connect (no stored passwords)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet publish src/FencingClub.Api -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  deploy:
    # Set repository variable AZURE_WEBAPP_NAME and secrets AZURE_CLIENT_ID / AZURE_TENANT_ID /
    # AZURE_SUBSCRIPTION_ID (from a federated credential) to turn this on.
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
